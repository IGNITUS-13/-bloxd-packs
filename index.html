<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOXD PACKS | Home</title>
    <style>
        :root { --neon-cyan: #00d4ff; --dark-bg: #090d12; --glass-border: rgba(0, 212, 255, 0.2); }
        
        body { 
            margin: 0; 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif;
            background-image: radial-gradient(circle at 50% -20%, #102a43, #090d12);
            min-height: 100vh;
        }

        /* BARRA DE NAVEGACIÓN */
        nav {
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.6rem; font-weight: 800; color: var(--neon-cyan); text-decoration: none; text-shadow: 0 0 10px var(--neon-cyan); }

        .menu { display: flex; gap: 20px; align-items: center; }
        .menu a { color: #8b949e; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .menu a:hover { color: var(--neon-cyan); }

        /* PERFIL Y BOTÓN LOGIN */
        .login-btn { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--neon-cyan); cursor: pointer; }
