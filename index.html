<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Upload - BLOXD PACKS</title>
    <style>
        :root { --neon-cyan: #00d4ff; --dark-bg: #090d12; --glass-border: rgba(0, 212, 255, 0.2); }
        body { margin: 0; background: var(--dark-bg); color: #fff; font-family: sans-serif; }
        nav { background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid var(--glass-border); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.6rem; color: var(--neon-cyan); text-decoration: none; }
        .menu { display: flex; gap: 20px; align-items: center; }
        .menu a { color: #8b949e; text-decoration: none; }
        .login-btn { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 18px; border-radius: 5px; cursor: pointer; }
        .container { max-width: 600px; margin: 80px auto; text-align: center; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 30px; border-radius: 15px; text-align: left; }
        input { width: 100%; background: #0d1117; border: 1px solid #333; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">BLOXD PACKS</a>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="upload.html" style="color:var(--neon-cyan)">Upload</a>
            <a href="creators.html">Creators</a>
            <button id="loginBtn" class="login-btn" onclick="loginWithGitHub()">Login</button>
        </div>
    </nav>
    <div class="container">
        <div id="loginRequiredMessage">
            <h2 style="color:var(--neon-cyan)">⚠️ LOGIN REQUIRED</h2>
            <p style="color:#8b949e">Please login to upload packs.</p>
        </div>
        <div class="card" id="uploadForm" style="display:none;">
            <h2>Upload Pack</h2>
            <input type="text" placeholder="Pack Name">
            <input type="file">
            <button style="width:100%; background:var(--neon-cyan); padding:15px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">PUBLISH</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
