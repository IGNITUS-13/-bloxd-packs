<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOXD PACKS | Home</title>
    <style>
        :root { --neon: #00d4ff; --bg: #090d12; --border: rgba(0, 212, 255, 0.2); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; background-image: radial-gradient(circle at 50% -20%, #102a43, #090d12); min-height: 100vh; overflow-x: hidden; }
        
        nav { background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid var(--border); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.6rem; color: var(--neon); text-decoration: none; font-weight: bold; text-shadow: 0 0 10px var(--neon); }
        .menu { display: flex; gap: 20px; align-items: center; }
        .menu a { color: #8b949e; text-decoration: none; transition: 0.3s; font-size: 0.9rem; }

        /* --- ESTILOS DE AVATAR CIRCULAR --- */
        .nav-avatar { 
            width: 38px !important; height: 38px !important; 
            border-radius: 50% !important; border: 2px solid var(--neon); 
            object-fit: cover !important; cursor: pointer; display: block;
        }

        .avatar-big-wrapper { 
            position: relative; width: 100px; height: 100px; 
            margin: 0 auto 15px; border-radius: 50%; overflow: hidden;
            border: 3px solid var(--neon); background: #0d1117;
        }
        .avatar-big { width: 100% !important; height: 100% !important; border-radius: 50%; object-fit: cover !important; }
        
        .camera-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); display: flex; align-items: center; 
            justify-content: center; opacity: 0; transition: 0.3s; cursor: pointer; 
        }
        .avatar-big-wrapper:hover .camera-overlay { opacity: 1; }

        /* --- DROPDOWN CARD --- */
        .profile-card { 
            display: none; position: absolute; right: 0; top: 50px; background: #161b22; 
            border: 1px solid var(--border); width: 240px; padding: 25px; 
            border-radius: 20px; text-align: center; box-shadow: 0 10px 50px #000; z-index: 2000; 
        }
        .profile-card.show { display: block; }

        .display-name { margin: 10px 0 5px; font-size: 1.2rem; color: #fff; }
        .user-email { font-size: 0.8rem; color: #8b949e; margin-bottom: 20px; }
        
        .opt-btn { width: 100%; background: #21262d; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 8px; font-size: 0.85rem; }
        .logout-btn { color: #ff4b4b; border-color: rgba(255, 75, 75, 0.2); }

        .hero { text-align: center; margin-top: 150px; }
        .hero h1 { font-size: 4rem; margin: 0; background: linear-gradient(90deg, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 8px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">BLOXD PACKS</a>
        <div class="menu">
            <a href="index.html" style="color:var(--neon)">Home</a>
            <a href="discover.html">Discover</a>
            <a href="upload.html">Upload</a>
            <a href="creators.html">Creators</a>
            <div id="userAuthContainer"></div>
        </div>
    </nav>
    <div class="hero">
        <h1>THE NEXT GEN OF TEXTURES</h1>
        <p style="color:#8b949e; font-size: 1.2rem;">Share and discover the best textures.</p>
    </div>
    <script src="https://js.puter.com/v2/"></script>
    <script src="app.js"></script>
</body>
</html>
