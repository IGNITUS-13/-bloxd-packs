        body { margin: 0; background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; background-image: radial-gradient(circle at 50% -20%, #102a43, #090d12); min-height: 100vh; }
        
        nav { width: 100%; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }

        .menu a { color: #8b949e; text-decoration: none; transition: 0.3s; font-size: 0.95rem; }
        .menu a:hover { color: var(--neon-cyan); }

        /* BOTÓN LOGIN */
        .login-btn { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .login-btn:hover { box-shadow: 0 0 15px var(--neon-cyan); background: var(--neon-cyan); color: #000; }

        /* ESTILOS PERFIL DROPDOWN */
        .profile-container { position: relative; display: inline-block; }
        .nav-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--neon-cyan); cursor: pointer; object-fit: cover; }
        .dropdown-content { 
            display: none; position: absolute; right: 0; background: #0d1117; border: 1px solid var(--glass-border); 
            min-width: 200px; padding: 15px; border-radius: 10px; margin-top: 10px; z-index: 1001; text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .dropdown-content.show { display: block; }

        .hero { text-align: center; margin-top: 100px; }
        .hero h1 { font-size: 3.5rem; background: linear-gradient(90deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
