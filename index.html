<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOXD PACKS | Home</title>
    <style>
        :root { --neon-cyan: #00d4ff; --dark-bg: #090d12; --glass-border: rgba(0, 212, 255, 0.2); }
        body { margin: 0; background: var(--dark-bg); color: #fff; font-family: sans-serif; background-image: radial-gradient(circle at 50% -20%, #102a43, #090d12); min-height: 100vh; }
        nav { background: rgba(13, 17, 23, 0.9); border-bottom: 1px solid var(--glass-border); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.6rem; font-weight: bold; color: var(--neon-cyan); text-decoration: none; text-shadow: 0 0 10px var(--neon-cyan); }
        .menu { display: flex; gap: 20px; align-items: center; }
        .menu a { color: #8b949e; text-decoration: none; transition: 0.3s; }
        .menu a:hover { color: var(--neon-cyan); }
        .hero { text-align: center; margin-top: 120px; }
        .hero h1 { font-size: 3.5rem; margin: 0; background: linear-gradient(90deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-container { max-width: 600px; margin: 40px auto; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 50px; display: flex; padding: 5px; }
        .search-bar { width: 100%; background: transparent; border: none; padding: 15px 25px; color: #fff; font-size: 1rem; outline: none; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">BLOXD PACKS</a>
        <div class="menu">
            <a href="index.html" style="color:var(--neon-cyan)">Home</a>
            <a href="discover.html">Discover</a>
            <a href="upload.html">Upload</a>
            <a href="creators.html">Creators</a>
            <div id="userAuthContainer"></div>
        </div>
    </nav>
    <div class="hero">
        <h1>The Next Gen of Textures</h1>
        <p style="color:#8b949e; font-size:1.2rem;">Explore and share the best Bloxd.io community packs.</p>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search packs, creators...">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
