<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOXD PACKS | Home</title>
    <style>
        :root { --neon-cyan: #00d4ff; --dark-bg: #090d12; --glass-border: rgba(0, 212, 255, 0.2); }
        
        body { 
            margin: 0; 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif;
            background-image: radial-gradient(circle at 50% -20%, #102a43, #090d12);
            min-height: 100vh;
        }

        /* BARRA DE NAVEGACIÓN */
        nav {
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.6rem; font-weight: 800; color: var(--neon-cyan); text-decoration: none; text-shadow: 0 0 10px var(--neon-cyan); }

        .menu { display: flex; gap: 20px; align-items: center; }
        .menu a { color: #8b949e; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .menu a:hover { color: var(--neon-cyan); }

        /* PERFIL Y BOTÓN LOGIN */
        .login-btn { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-avatar { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--neon-cyan); cursor: pointer; }
        
        .profile-container { position: relative; }
        .dropdown-content { 
            display: none; position: absolute; right: 0; background: #161b22; border: 1px solid var(--glass-border); 
            min-width: 180px; padding: 15px; border-radius: 10px; margin-top: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .dropdown-content.show { display: block; }

        /* CONTENIDO CENTRAL */
        .hero { text-align: center; margin-top: 120px; padding: 0 20px; }
        .hero h1 { font-size: 3.5rem; margin: 0; background: linear-gradient(90deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: #8b949e; font-size: 1.2rem; margin-top: 10px; }

        .search-container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            display: flex;
            padding: 5px;
        }
        .search-bar { width: 100%; background: transparent; border: none; padding: 15px 25px; color: #fff; font-size: 1rem; outline: none; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">BLOXD PACKS</a>
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="discover.html">Discover</a>
                <a href="upload.html">Upload</a>
                <a href="creators.html">Creators</a>
                <!-- AQUÍ ES DONDE APARECE EL LOGIN O TU FOTO -->
                <div id="userAuthContainer">
                    <button class="login-btn" onclick="loginWithGitHub()">Login</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="hero">
        <h1>The Next Gen of Textures</h1>
        <p>Search, download, and share the best Bloxd.io packs.</p>
        
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search texture packs, creators...">
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
