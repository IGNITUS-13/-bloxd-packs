<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Upload - BLOXD PACKS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">BLOXD PACKS</a>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="upload.html" style="color:var(--neon)">Upload</a>
            <a href="creators.html">Creators</a>
            <div id="userAuthContainer"></div>
        </div>
    </nav>
    <div style="max-width:600px; margin:50px auto; padding:20px; text-align:center;">
        <div id="loginRequiredMessage" style="border:1px solid #ff4b4b33; padding:40px; border-radius:20px;">
            <h2 style="color:#ff4b4b;">⚠️ LOGIN REQUIRED</h2>
            <button class="login-btn" onclick="handleLogin()">Login Now</button>
        </div>
        <div id="uploadForm" class="profile-card" style="display:none; position:static; width:100%;">
            <h2 style="margin-top:0;">Publish Pack</h2>
            <input type="text" id="pName" placeholder="Pack Name" style="width:100%; padding:12px; background:#0d1117; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:15px;">
            <select id="pRes" style="width:100%; padding:12px; background:#0d1117; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:15px;"><option>16x16</option><option>32x32</option><option>64x64</option></select>
            <button class="opt-btn" style="background:var(--neon); color:#000; font-weight:bold;" onclick="publishPack()">PUBLISH TO COMMUNITY</button>
        </div>
    </div>
    <script src="https://js.puter.com/v2/"></script>
    <script src="app.js"></script>
</body>
</html>
