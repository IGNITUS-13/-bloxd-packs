<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Upload - BLOXD PACKS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .upload-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 40px; border-radius: 20px; text-align: left; backdrop-filter: blur(10px); }
        .section-title { color: var(--neon); text-transform: uppercase; font-size: 0.8rem; margin: 25px 0 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        input, select { width: 100%; background: #0d1117; border: 1px solid #333; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 15px; box-sizing: border-box; }
        .tags-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; background: #0d1117; padding: 15px; border-radius: 10px; }
        .tag-opt { font-size: 0.8rem; color: #8b949e; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .tag-opt input { accent-color: var(--neon); }
        .publish-btn { width: 100%; background: var(--neon); color: #000; border: none; padding: 18px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 30px; transition: 0.3s; }
        .publish-btn:hover { box-shadow: 0 0 25px var(--neon); transform: scale(1.02); }
    </style>
</head>
