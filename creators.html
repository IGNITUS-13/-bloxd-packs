<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - BLOXD PACKS</title>
    <style>
        /* Reutilizamos los mismos estilos para que todo se vea igual */
        :root { --neon-cyan: #00d4ff; --dark-bg: #090d12; --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(0, 212, 255, 0.2); }
        body { margin: 0; background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; background-image: radial-gradient(circle at 50% -20%, #102a43, #090d12); min-height: 100vh; }
        nav { width: 100%; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; }
        .nav-container { width: 90%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--neon-cyan); text-decoration: none; }
        .menu { display: flex; gap: 20px; align-items: center; }
        .menu a { color: #8b949e; text-decoration: none; font-size: 0.95rem; }
        .nav-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--neon-cyan); cursor: pointer; }
        .profile-container { position: relative; }
        .dropdown-content { display: none; position: absolute; right: 0; background: #0d1117; border: 1px solid var(--glass-border); min-width: 180px; padding: 15px; border-radius: 10px; margin-top: 10px; z-index: 1001; }
        .dropdown-content.show { display: block; }
        .login-btn { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 20px; border-radius: 5px; cursor: pointer; }

        .container { width: 90%; max-width: 900px; margin: 60px auto; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: var(--glass); border-radius: 15px; overflow: hidden; border: 1px solid var(--glass-border); }
        th { background: rgba(0, 212, 255, 0.1); color: var(--neon-cyan); padding: 20px; text-transform: uppercase; font-size: 0.8rem; }
        td { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">BLOXD PACKS</a>
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="discover.html">Discover</a>
                <a href="upload.html">Upload</a>
                <a href="creators.html" style="color:var(--neon-cyan)">Pack Creators</a>
                <div id="userAuthContainer"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 style="text-shadow: 0 0 15px var(--neon-cyan);">👑 Global Leaderboard</h1>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Creator</th>
                    <th>Packs</th>
                    <th>Total Stars</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <!-- Se llenará automáticamente cuando subas packs -->
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
