<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Creators - IGNITUS PACKS</title>
    <style>
        :root { --neon-cyan: #00d4ff; --dark-bg: #090d12; --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(0, 212, 255, 0.2); }
        body { margin: 0; background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background-image: radial-gradient(circle at 50% -20%, #102a43, #090d12); }
        
        nav { width: 100%; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; display: flex; justify-content: center; position: sticky; top: 0; z-index: 100; }
        .nav-container { width: 90%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--neon-cyan); text-decoration: none; text-shadow: 0 0 10px var(--neon-cyan); }
        .menu a { color: #8b949e; text-decoration: none; margin-left: 20px; transition: 0.3s; }
        .menu a.active { color: var(--neon-cyan); }

        .container { width: 90%; max-width: 900px; margin-top: 60px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 40px; text-shadow: 0 0 15px rgba(0, 212, 255, 0.3); }

        /* TABLA ESTILO CYBERPUNK */
        .leaderboard-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(0, 212, 255, 0.1); color: var(--neon-cyan); padding: 20px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        td { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .rank { font-weight: bold; font-size: 1.2rem; color: var(--neon-cyan); }
        .creator-info { display: flex; align-items: center; gap: 15px; justify-content: flex-start; }
        .avatar { width: 40px; height: 40px; background: #21262d; border-radius: 50%; border: 1px solid var(--neon-cyan); }
        
        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stars-count { color: #ffd700; font-weight: bold; }

        tr:hover { background: rgba(0, 212, 255, 0.03); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">IGNITUS PACKS</a>
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="discover.html">Discover</a>
                <a href="upload.html">Upload</a>
                <a href="creators.html" class="active">Pack Creators</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>👑 Global Leaderboard</h1>
        
        <div class="leaderboard-card">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Creator</th>
                        <th>Packs</th>
                        <th>Total Stars</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Ejemplo de fila -->
                    <tr>
                        <td class="rank">#1</td>
                        <td>
                            <div class="creator-info">
                                <div class="avatar"></div>
                                <span>IGNITUS-13</span>
                            </div>
                        </td>
                        <td><span class="stat-badge">12 Packs</span></td>
                        <td><span class="stat-badge stars-count">★ 450</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
