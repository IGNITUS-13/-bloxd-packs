<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover - IGNITUS PACKS</title>
    <style>
        /* REUTILIZAMOS ESTILOS BASE */
        :root { --neon-cyan: #00d4ff; --dark-bg: #090d12; --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(0, 212, 255, 0.2); }
        body { margin: 0; background: var(--dark-bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        nav { width: 100%; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); padding: 15px 0; display: flex; justify-content: center; position: sticky; top: 0; z-index: 100; }
        .nav-container { width: 90%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--neon-cyan); text-decoration: none; text-shadow: 0 0 10px var(--neon-cyan); }
        .menu a { color: #8b949e; text-decoration: none; margin-left: 20px; transition: 0.3s; }
        .menu a.active { color: var(--neon-cyan); }

        .container { width: 90%; max-width: 1200px; margin-top: 40px; }

        /* FILTROS */
        .filter-section {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .filter-group { margin-bottom: 20px; }
        .filter-group h4 { color: var(--neon-cyan); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1.5px; margin-bottom: 15px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag-btn {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .tag-btn:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }

        /* GRID DE PACKS (Ejemplo visual) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .pack-card {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .pack-img { width: 100%; height: 160px; background: #21262d; }
        .pack-info { padding: 15px; }
        .pack-title { font-weight: bold; margin-bottom: 10px; }
        .pack-tags { display: flex; gap: 5px; flex-wrap: wrap; }
        .mini-tag { font-size: 0.7rem; color: var(--neon-cyan); background: rgba(0,212,255,0.1); padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">IGNITUS PACKS</a>
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="discover.html" class="active">Discover</a>
                <a href="upload.html">Upload</a>
                <a href="creators.html">Pack Creators</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="filter-section">
            <div class="filter-group">
                <h4>Gamemodes</h4>
                <div class="tags-container">
                    <button class="tag-btn">Bedwars</button>
                    <button class="tag-btn">Bridge</button>
                    <button class="tag-btn">Skywars</button>
                    <button class="tag-btn">Survival Games</button>
                    <button class="tag-btn">Lobbies</button>
                </div>
            </div>

            <div class="filter-group">
                <h4>Themes</h4>
                <div class="tags-container">
                    <button class="tag-btn">Aesthetic</button>
                    <button class="tag-btn">Animated</button>
                    <button class="tag-btn">Anime</button>
                    <button class="tag-btn">FPS Boost</button>
                    <button class="tag-btn">Overlay</button>
                </div>
            </div>

            <div class="filter-group">
                <h4>Colors</h4>
                <div class="tags-container">
                    <button class="tag-btn" style="border-color: cyan">Cyan</button>
                    <button class="tag-btn" style="border-color: red">Red</button>
                    <button class="tag-btn" style="border-color: blue">Blue</button>
                    <button class="tag-btn" style="border-color: purple">Purple</button>
                    <button class="tag-btn" style="border-color: green">Green</button>
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- Esto es solo un ejemplo de cómo se verán los packs -->
            <div class="pack-card">
                <div class="pack-img"></div>
                <div class="pack-info">
                    <div class="pack-title">Ultra PvP Pack v1</div>
                    <div class="pack-tags">
                        <span class="mini-tag">PvP</span>
                        <span class="mini-tag">64x64</span>
                        <span class="mini-tag">Cyan</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
